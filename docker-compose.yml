services:
  app:
    build: .
    container_name: mlquest-app
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - mlquest-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/info').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: mlquest-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mlquest-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1/api/info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  mlquest-network:
    driver: bridge
