<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ML Quest · Control</title>
<style>
  /* the whole controller is drawn in the map's own materials: plank walls, cream boards, black
     outlines, grey floor slabs and the yellow of the ! markers */
  :root { --wood:#debc8b; --plank:#c9a26f; --cream:#f3ead2; --brown:#9e8572; --slab:#696969; --ink:#2b2118; --mark:#ffd23f;
          --planks:repeating-linear-gradient(to bottom, var(--wood) 0 22px, var(--plank) 22px 24px); --ok:#5fd068; --warn:#f2c14e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; background:var(--planks); color:var(--ink); font-family: ui-monospace, Menlo, Consolas, monospace; overflow:hidden; touch-action:none; overscroll-behavior:none; }
  .pad { position:fixed; inset:0; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;
         padding:max(38px, calc(env(safe-area-inset-top) + 30px)) max(24px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
  /* status: a grey floor slab across the top */
  .status { position:fixed; top:0; left:0; right:0; text-align:center; font-size:12px; font-weight:700; pointer-events:none;
            padding:max(5px, env(safe-area-inset-top)) 10px 5px; background:var(--slab); color:var(--cream);
            border-bottom:3px solid #000; box-shadow:inset 0 3px 0 #8a8a8a; }
  .dot { display:inline-block; width:10px; height:10px; background:var(--warn); border:2px solid #000; margin-right:6px; vertical-align:-1px; }
  .dot.on { background:var(--ok); }
  /* "?" in the corner of the status slab: opens the onboarding again */
  .help { position:fixed; z-index:2; top:max(3px, env(safe-area-inset-top)); right:max(10px, env(safe-area-inset-right)); width:24px; height:22px; padding:0;
          font-size:13px; background:var(--mark); box-shadow:none; border-width:2px; }
  body.quizzing .help { display:none; }
  button { font:inherit; color:var(--ink); background:var(--cream); border:3px solid #000; border-radius:0;
           box-shadow:inset 0 -5px 0 var(--brown), 0 4px 0 #000; touch-action:none; font-weight:700; }
  button.on { transform:translateY(3px); box-shadow:inset 0 -2px 0 var(--brown), 0 1px 0 #000; background:var(--mark); }
  /* left/right: one compact control split down the middle, [ ◀ | ▶ ] */
  .lr { justify-self:start; display:flex; --s:min(15vw, 24vh); border:3px solid #000; box-shadow:0 4px 0 #000; }
  .lr button { width:calc(var(--s) * 1.3); height:calc(var(--s) * 1.5); border:0; box-shadow:inset 0 -5px 0 var(--brown); font-size:calc(var(--s) * .45); }
  .lr button + button { border-left:3px solid #000; }
  .lr button.on { transform:none; box-shadow:inset 0 -2px 0 var(--brown); }
  .acts { justify-self:end; position:relative; width:min(34vw, 58vh); height:min(30vw, 50vh); }
  .acts button { position:absolute; border-radius:50%; color:#fff; text-shadow:2px 2px 0 #000; box-shadow:inset 0 -5px 0 rgba(0,0,0,.3), 0 4px 0 #000; }
  .acts button.on { box-shadow:inset 0 -2px 0 rgba(0,0,0,.3), 0 1px 0 #000; filter:brightness(1.2); }
  [data-b=jump] { width:46%; aspect-ratio:1; right:2%; bottom:12%; font-size:clamp(14px,3.5vw,22px); background:#3a5fcd; }
  [data-b=dash] { width:38%; aspect-ratio:1; left:6%; bottom:0; font-size:clamp(12px,3vw,18px); background:#2f8f5b; }
  /* the action button: the colour of the markers it opens, with a pointing hand instead of a word */
  [data-b=act]  { width:32%; aspect-ratio:1; left:24%; top:0; padding:0; background:var(--mark); display:grid; place-items:center; }
  [data-b=act] img { width:48%; image-rendering:pixelated; pointer-events:none; }
  [data-b=act].on { background:#e1a400; filter:none; }
  /* standing where it does something: the action button pulses */
  [data-b=act].ready { animation:ready .7s ease-in-out infinite alternate; }
  @keyframes ready { from { box-shadow:inset 0 -5px 0 rgba(0,0,0,.3), 0 4px 0 #000, 0 0 0 0 #fff; }
                     to   { box-shadow:inset 0 -5px 0 rgba(0,0,0,.3), 0 4px 0 #000, 0 0 0 8px #fff; } }
  /* the action button as it appears inside a sentence */
  .acticon { display:inline-grid; place-items:center; width:1.6em; height:1.6em; vertical-align:middle; border-radius:50%;
             background:var(--mark); border:2px solid #000; margin:0 2px; }
  .acticon img { width:62%; image-rendering:pixelated; }
  /* quiz panel: takes over the whole phone with the controls hidden, drawn in the map's own
     materials — plank walls, cream boards, black outlines, grey slabs and the yellow of the markers.
     The lift and the onboarding use this same panel. It never scrolls: every size in it is in em, so
     fitPanel() can shrink the panel's one font size until whatever it shows fits the screen. */
  body.quizzing .pad, body.quizzing .status { display:none; }
  #quiz { --pl:max(12px, env(safe-area-inset-left)); --pr:max(12px, env(safe-area-inset-right));
          position:fixed; inset:0; z-index:12; color:var(--ink); display:none; flex-direction:column; overflow:hidden;
          font-size:clamp(10px, min(4.2vh, 2.3vw), 16px); background:var(--planks);
          padding:0 var(--pr) max(.6em, env(safe-area-inset-bottom)) var(--pl); }
  #quiz.on { display:flex; }
  /* header: a grey floor slab across the top */
  #quiz header { display:flex; align-items:center; gap:.7em; flex:0 0 auto; margin:0 calc(-1 * var(--pr)) 0 calc(-1 * var(--pl));
                 padding:max(.4em, env(safe-area-inset-top)) var(--pr) .4em var(--pl); background:var(--slab); color:var(--cream);
                 border-bottom:3px solid #000; box-shadow:inset 0 3px 0 #8a8a8a; white-space:nowrap; }
  #quiz h1 { margin:0; font-size:1.08em; color:var(--mark); text-shadow:2px 2px 0 #000; overflow:hidden; text-overflow:ellipsis; }
  #quiz .floor { font-size:.92em; opacity:.85; overflow:hidden; text-overflow:ellipsis; }
  #quiz .badge { margin-left:auto; font-weight:700; background:#000; color:var(--mark); padding:.15em .6em; }
  #quiz .badge:empty { display:none; }
  #quiz .body { flex:1 1 auto; min-height:0; overflow:hidden; margin-top:.6em; display:flex; flex-direction:column; }
  #quiz .body > * { flex:0 0 auto; }
  #quiz .body.ask { gap:.6em; }
  /* the question box: a cream board that takes the free space above the answers */
  #quiz .body.ask .stem { flex:1 0 auto; }
  #quiz .stem { display:flex; text-align:center;
                background:var(--cream); border:3px solid #000; box-shadow:inset 0 -4px 0 var(--wood), 4px 4px 0 rgba(0,0,0,.3); padding:.45em 1.2em; }
  #quiz .stem > div { margin:auto; }
  #quiz .ctx { line-height:1.35; margin:0 0 .3em; }
  #quiz .q { font-size:1.1em; font-weight:700; margin:0; }
  /* answers: 2x2, and a fifth one centred underneath */
  #quiz .opts { display:grid; grid-template-columns:1fr 1fr; gap:.45em .75em; }
  #quiz .opts button { display:flex; gap:.6em; align-items:center; text-align:left; min-height:3.3em; padding:.35em .75em .65em .45em;
                       font-size:.95em; line-height:1.25; font-weight:600; color:var(--ink);
                       background:var(--cream); border:3px solid #000; border-radius:0; box-shadow:inset 0 -5px 0 var(--brown), 3px 3px 0 rgba(0,0,0,.3); }
  #quiz .opts button:nth-child(5) { grid-column:1 / -1; justify-self:center; width:calc(50% - .375em); }
  /* the letter is a little copy of the ! marker */
  #quiz .opts button .k { flex:0 0 auto; display:grid; place-items:center; width:1.7em; height:1.7em; background:var(--mark); color:#000; border:2px solid #000; font-weight:800; }
  #quiz .opts button.pick { background:var(--mark); box-shadow:inset 0 -5px 0 #d99a00, 3px 3px 0 rgba(0,0,0,.3); transform:translateY(2px); }
  #quiz .opts button.pick .k { background:#000; color:var(--mark); }
  #quiz .note { margin:.9em auto 0; max-width:43em; line-height:1.5; text-align:center; background:var(--cream); border:3px solid #000; padding:.75em .9em; }
  #quiz .rank { display:grid; gap:.6em; margin:.45em auto 0; width:min(43em, 100%); }
  #quiz .rank div { display:flex; align-items:center; gap:.75em; background:var(--cream); border:3px solid #000; box-shadow:inset 0 -4px 0 var(--brown); padding:.55em .9em .75em; font-size:1.08em; }
  #quiz .rank b { flex:1; }
  #quiz .rank .pos { display:grid; place-items:center; width:1.7em; height:1.7em; background:var(--mark); border:2px solid #000; font-weight:800; }
  /* the career's icon: 24px pixel art whose drawing sits in the middle 10x10 px, so only that middle
     is shown (background at 240%, centred), scaled up without smoothing */
  #quiz .rank .icon { width:2.2em; height:2.2em; background:center / 240% no-repeat; image-rendering:pixelated; flex:0 0 auto; }
  #quiz .rank .pct { font-weight:800; }
  #quiz .rank div.first { background:var(--mark); box-shadow:inset 0 -4px 0 #d99a00; font-size:1.2em; }
  #quiz .rank div.first .pos { background:#000; color:var(--mark); }
  #quiz .rank div.first .icon { width:2.8em; height:2.8em; }
  #quiz .close { display:block; margin:.75em auto 0; padding:.55em 2.1em; font-size:1.08em; border-radius:0; color:var(--cream); background:var(--slab); border:3px solid #000; box-shadow:inset 0 3px 0 #8a8a8a, 3px 3px 0 rgba(0,0,0,.3); }
  #quiz .nav { display:flex; justify-content:center; gap:.75em; }
  #quiz .nav .close { margin:.75em 0 0; }
  #quiz .close.go { background:var(--mark); color:#000; box-shadow:inset 0 -4px 0 #d99a00, 3px 3px 0 rgba(0,0,0,.3); }
  #quiz .nav .close:disabled { opacity:.45; }
  /* the lift's floor panel: black buttons with yellow numbers, like the display over every lift door */
  #quiz .lift { display:grid; grid-template-columns:repeat(3, 4.6em); gap:.85em; justify-content:center; justify-items:center; margin:.3em auto 0; padding:1em 1.2em;
                background:var(--cream); border:3px solid #000; box-shadow:inset 0 -4px 0 var(--brown), 4px 4px 0 rgba(0,0,0,.3); }
  #quiz .lift button { width:3.3em; height:3.3em; border-radius:50%; background:#000; color:var(--mark); font-size:1.4em; padding:0; border-color:#555; box-shadow:0 3px 0 #555;
                        display:flex; align-items:center; justify-content:center; }
  /* width/height above are in em, which is relative to THIS element's own font-size — shrinking
     the font here would shrink the circle too, so compensate by the same ratio (1.4/1.05) to keep
     it the same 3.3em-at-14px size */
  #quiz .lift button.wide { font-size:1.05em; width:4.4em; height:4.4em; }
  #quiz .lift button.here { background:var(--mark); color:#000; border-color:#000; box-shadow:none; }
  /* onboarding: the map's symbols, each drawn exactly as on the big screen, with what it means */
  #quiz .legend { display:grid; grid-template-columns:repeat(3, 1fr); gap:.6em; width:min(69em, 100%); margin:0 auto; }
  #quiz .legend > div { display:flex; align-items:center; gap:.75em; background:var(--cream); border:3px solid #000;
                        box-shadow:inset 0 -4px 0 var(--brown); padding:.45em .6em .7em; font-size:.85em; line-height:1.3; }
  #quiz .legend .sym { flex:0 0 5.8em; height:5em; display:grid; place-items:center; }
  #quiz .legend b { display:block; font-size:1.1em; margin-bottom:.1em; }
  #quiz .legend .mini { width:3em; height:3em; background:url(sprites/Idle.png) 0 0 / 400% 100% no-repeat; image-rendering:pixelated; animation:idle2 .67s steps(4) infinite; }
  @keyframes idle2 { to { background-position:133.33% 0; } }
  #quiz .legend .tag { font-weight:800; text-shadow:1px 1px 0 #000; text-align:center; }
  #quiz .keys { display:grid; grid-template-columns:repeat(4, 1fr); gap:.6em; width:min(56em, 100%); margin:0 auto; }
  #quiz .keys > div { display:flex; flex-direction:column; align-items:center; gap:.45em; text-align:center; background:var(--cream); border:3px solid #000;
                      box-shadow:inset 0 -4px 0 var(--brown); padding:.6em .45em .75em; font-size:.85em; line-height:1.3; }
  #quiz .keys .k2 { display:grid; place-items:center; height:3.6em; min-width:3.6em; padding:0 .45em; border:3px solid #000; border-radius:50%; color:#fff; font-weight:800; font-size:.9em; text-shadow:1px 1px 0 #000; }
  #quiz .keys .k2 img { width:1.8em; image-rendering:pixelated; }
  #quiz .keys .lrk { border-radius:0; background:var(--cream); color:var(--ink); text-shadow:none; font-size:1.2em; padding:0; display:flex; }
  #quiz .keys .lrk span { padding:.4em .55em; } #quiz .keys .lrk span + span { border-left:3px solid #000; }
  #quiz .steps { width:min(49em, 100%); margin:0 auto; padding:.6em 1.1em .6em 2.6em; background:var(--cream); border:3px solid #000; box-shadow:inset 0 -4px 0 var(--brown);
                 line-height:1.5; }
  /* character preview: every phone gets a different colour, so show the student which one is theirs */
  .me { justify-self:center; visibility:hidden; display:flex; flex-direction:column; align-items:center; gap:4px; --sp:min(64px, 17vh);
        pointer-events:none; font-size:11px; font-weight:700; }
  .me.on { visibility:visible; }
  .me .frame { padding:6px 8px 4px; background:#f3ead2; border:3px solid #000; box-shadow:inset 0 -4px 0 #debc8b; }
  .me .sprite { width:var(--sp); height:var(--sp); background:url(sprites/Idle.png) 0 0 / 400% 100% no-repeat; image-rendering:pixelated; animation:idle .67s steps(4) infinite; }
  @keyframes idle { to { background-position:133.33% 0; } }
  .me b { font-size:14px; text-shadow:2px 2px 0 #000; }
  /* character choice: one card per character, the picked one lit up */
  #quiz .chars { display:flex; gap:1.5em; justify-content:center; }
  #quiz .chars button { display:flex; flex-direction:column; align-items:center; gap:.5em; padding:.8em 1.4em 1em; background:var(--cream);
                        box-shadow:inset 0 -5px 0 var(--brown), 3px 3px 0 rgba(0,0,0,.3); font-weight:800; font-size:1.1em; }
  #quiz .chars button.pick { background:var(--mark); box-shadow:inset 0 -5px 0 #d99a00, 3px 3px 0 rgba(0,0,0,.3); }
  /* sign-up: the email and the two data authorizations, before anything else */
  #quiz .reg { width:min(46em, 100%); margin:0 auto; display:grid; gap:.55em; }
  #quiz .reg .doc { text-align:center; line-height:1.4; }
  #quiz .reg .doc a { color:var(--ink); font-weight:700; }
  #quiz .reg label { display:flex; align-items:center; gap:.7em; font-weight:700; }
  #quiz .reg input { flex:1; min-width:0; font:inherit; font-size:1.05em; padding:.45em .6em; border:3px solid #000; border-radius:0; background:#fff; color:var(--ink); }
  #quiz .reg input.bad { border-color:#c0392b; }
  #quiz .reg .yn { display:flex; align-items:center; gap:.6em; background:var(--cream); border:3px solid #000; box-shadow:inset 0 -4px 0 var(--brown); padding:.4em .6em .6em; }
  #quiz .reg .yn span { flex:1; font-weight:700; }
  #quiz .reg .yn button { padding:.3em 1.1em .45em; background:#fff; border:3px solid #000; border-radius:0; font-weight:800; box-shadow:inset 0 -3px 0 var(--brown); }
  #quiz .reg .yn button.pick { background:var(--mark); box-shadow:inset 0 -3px 0 #d99a00; }
  #quiz .reg .hint { margin:0; text-align:center; font-size:.9em; min-height:1.3em; }
  #quiz .reg.form label { display:grid; grid-template-columns:5.5em 1fr; }
  /* the logo under the finale's big line: 16px pixel art, scaled up without smoothing */
  #quiz .hero-logo { display:block; width:4.9em; height:4.9em; margin:.7em auto 0; image-rendering:pixelated; }
  /* the finale's big line */
  #quiz .hero { margin:1em auto .2em; max-width:24em; text-align:center; font-size:1.9em; font-weight:800; line-height:1.25; color:#000;
                background:var(--mark); border:3px solid #000; box-shadow:inset 0 -5px 0 #d99a00, 4px 4px 0 rgba(0,0,0,.3); padding:.6em .8em .75em; }
  #quiz .looks { display:flex; gap:2em; align-items:center; justify-content:center; }
  #quiz .swatches { display:flex; flex-direction:column; gap:1em; }
  #quiz .swatches > div { display:flex; align-items:center; gap:.7em; }
  #quiz .swatches b { width:4.5em; font-size:1.05em; }
  #quiz .swatches button { width:2.8em; height:2.8em; padding:0; border:3px solid #000; box-shadow:inset 0 -4px 0 rgba(0,0,0,.25); }
  #quiz .swatches button.pick { outline:4px solid var(--mark); outline-offset:2px; }
  #quiz .chars .pic { width:6em; height:6em; background:0 0 / 400% 100% no-repeat; image-rendering:pixelated; animation:idle2 .67s steps(4) infinite; }
  .rotate { display:none; position:fixed; inset:0; background:var(--planks); font-weight:700; z-index:9; align-items:center; justify-content:center; text-align:center; padding:24px; font-size:18px; }
  @media (orientation:portrait) { .rotate { display:flex; } }
</style>
</head>
<body>
<div class="status"><span class="dot" id="dot"></span><span id="txt">conectando…</span></div>
<button class="help" id="help" aria-label="Cómo jugar">?</button>
<div class="pad">
  <div class="lr">
    <button data-b="left" aria-label="Izquierda">◀</button><button data-b="right" aria-label="Derecha">▶</button>
  </div>
  <div class="me" id="me"><span>Tu personaje</span><div class="frame"><div class="sprite" id="meSprite"></div></div><b id="meTag"></b></div>
  <div class="acts">
    <button data-b="act" aria-label="Interactuar"><img id="actImg" alt=""></button>
    <button data-b="dash">DASH</button>
    <button data-b="jump">SALTO</button>
  </div>
</div>
<div id="quiz">
  <header><h1 id="qRoom"></h1><span class="floor" id="qFloor"></span><span class="badge" id="qBadge"></span></header>
  <div class="body" id="qBody"></div>
</div>
<div class="rotate">Gira el telefono a horizontal ↻</div>
<script src="events.js"></script>
<script src="symbols.js"></script>
<script src="colors.js"></script>
<script>
'use strict';
const state = {};
let ws, slot = '?', games = 0, progress = null, retryTimer = null;
const dot = document.getElementById('dot'), txt = document.getElementById('txt');

// This phone's key, kept across reloads: the server makes the player's id from it, so after a
// dropped connection the phone comes back as the same player, with its answers and its colour.
const KEY = (() => {
  const fresh = () => [...crypto.getRandomValues(new Uint8Array(10))].map((b) => b.toString(16).padStart(2, '0')).join('');
  try {
    let k = localStorage.getItem('mlquest-key');
    if (!k) { k = fresh(); localStorage.setItem('mlquest-key', k); }
    return k;
  } catch { return fresh(); }
})();
const store = {   // per-phone flags; if storage is blocked they just last as long as the page
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
// the character this phone plays: 'm' or 'f' (null until the student picks one), and its skin and
// hair colour (indexes into SKINS / HAIRS in colors.js)
let char = store.get('mlquest-char');
const storedIndex = (k) => { const n = Number(store.get(k)); return Number.isInteger(n) && n >= 0 && n <= 2 ? n : 0; };
let skin = storedIndex('mlquest-skin'), hair = storedIndex('mlquest-hair');
// this slot's colour, the same one the game gives it (colors.js); '?' before the server has said
const tagColor = () => (typeof slot === 'number' ? colorFor(slot) : '');
// each character's Idle sheet, painted as an element's background in this player's colours
const idleSheets = {};
function paintSprite(el, c) {
  const paint = () => { el.style.backgroundImage = `url(${recolorSheet(idleSheets[c], { shirt: tagColor(), skin, hair }).toDataURL()})`; };
  if (idleSheets[c]?.complete) return paint();
  if (!idleSheets[c]) { idleSheets[c] = new Image(); idleSheets[c].src = `sprites/${c === 'f' ? 'f/' : ''}Idle.png`; }
  idleSheets[c].addEventListener('load', paint, { once: true });
}
function showCharacter() {
  const sp = document.getElementById('meSprite');
  paintSprite(sp, char);
  const tag = document.getElementById('meTag');
  tag.textContent = 'P' + slot;
  tag.style.color = tagColor();
  document.getElementById('me').classList.add('on');
}
function showStatus() {
  dot.classList.toggle('on', games > 0);
  txt.textContent = games === 0 ? 'buscando la pantalla de juego…'
    : !progress ? `Jugador ${slot} · jugando`
    : progress.collected >= progress.total ? `Jugador ${slot} · ${progress.total}/${progress.total} · ve con Séneca en el ${TOP_FLOOR}.º piso`
    : `Jugador ${slot} · ${progress.collected}/${progress.total} eventos`;
}

function send(msg = { t: 'input', s: { ...state } }) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
}
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=controller&key=${KEY}&char=${char || 'm'}&skin=${skin}&hair=${hair}`);
  ws.onopen = () => { txt.textContent = 'conectado'; send(); if (registered()) send({ t: 'register', ...JSON.parse(store.get('mlquest-reg')) }); };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === 'hello') {
      slot = m.slot; document.title = `ML Quest · J${slot}`; progress = null; showCharacter();
      // a fresh connection: whatever the game had open is gone (the phone's own forms stay)
      if (!['intro', 'register', 'finale'].includes(panel)) closeQuiz();
      // first time on this phone: the onboarding, once (a reconnect must not send it back to page 1)
      if (registered() && (!store.get('mlquest-intro') || !char) && panel !== 'intro') showIntro(0);
    }
    if (m.t === 'ask') showQuestion(m);
    else if (m.t === 'saved') showSaved(m);
    else if (m.t === 'notice') showNotice(m);
    else if (m.t === 'result') showResult(m);
    else if (m.t === 'finale') showFinale();
    else if (m.t === 'lift') showLift(m);
    else if (m.t === 'close') closeQuiz();
    else if (m.t === 'near') actBtn.classList.toggle('ready', !!m.on);
    else if (m.t === 'progress') { progress = m; showStatus(); }
    if (m.t === 'hello' || m.t === 'status') {
      if (m.games !== undefined) games = m.games;
      showStatus();
      // On a host that runs several copies of the server (Vercel), this phone can land on a copy the
      // game screen is not connected to. If no game shows up soon, reconnect and try another copy.
      clearTimeout(retryTimer);
      if (games === 0) retryTimer = setTimeout(() => { if (games === 0) ws.close(); }, 2500);
    }
  };
  ws.onclose = () => { dot.classList.remove('on'); txt.textContent = 'reconectando…'; setTimeout(connect, 800); };
}

// ---- the action button's icon, on the button and wherever a message mentions it ----
const HAND_URL = bitmapURL(HAND, 2);
document.getElementById('actImg').src = HAND_URL;
function actIcon() {
  const s = document.createElement('span'); s.className = 'acticon';
  const i = document.createElement('img'); i.src = HAND_URL; i.alt = 'botón de interactuar';
  s.appendChild(i);
  return s;
}
// text in which {act} stands for the action button
function richText(el, text) {
  text.split('{act}').forEach((part, i) => { if (i) el.appendChild(actIcon()); el.appendChild(document.createTextNode(part)); });
  return el;
}
const note = (text) => richText(Object.assign(document.createElement('p'), { className: 'note' }), text);
function panelButton(label, onClick, go = false) {
  const b = document.createElement('button'); b.className = 'close' + (go ? ' go' : ''); b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

// ---- the panel: questions, notices, results, the lift and the onboarding all take over the phone here ----
const quiz = document.getElementById('quiz');
const qRoom = document.getElementById('qRoom'), qFloor = document.getElementById('qFloor');
const qBadge = document.getElementById('qBadge'), qBody = document.getElementById('qBody');
const actBtn = document.querySelector('[data-b=act]');
let flashTimer = null, panel = null;

function releaseAll() {
  for (const k in state) state[k] = false;
  document.querySelectorAll('button.on').forEach((b) => b.classList.remove('on'));
  send();
}
function openQuiz(kind) {
  clearTimeout(flashTimer);
  panel = kind;
  quiz.classList.add('on');
  document.body.classList.add('quizzing');
  fitPanel();
}
// Nothing on the phone scrolls: if what the panel shows does not fit the screen, shrink the panel's
// font size (every size in it is in em) until it does.
function fitPanel() {
  if (!quiz.classList.contains('on')) return;
  quiz.style.fontSize = '';
  let fs = parseFloat(getComputedStyle(quiz).fontSize);
  const over = () => qBody.scrollHeight > qBody.clientHeight + 1 || qBody.scrollWidth > qBody.clientWidth + 1;
  while (over() && fs > 7) { fs -= 0.5; quiz.style.fontSize = fs + 'px'; }
}
addEventListener('resize', fitPanel);
function closeQuiz() {
  panel = null;
  quiz.classList.remove('on');
  document.body.classList.remove('quizzing');
}
function setHeader(title, floor, badge) {
  qRoom.textContent = title; qFloor.textContent = floor || ''; qBadge.textContent = badge || '';
  qBody.innerHTML = ''; qBody.classList.remove('ask');
}
// the corner of the header shows how far along this player is, e.g. 2/4
const progressBadge = () => (progress ? progress.collected + '/' + progress.total : '');
function showQuestion(m) {
  releaseAll();                       // drop the controls so the character stops where it is
  setHeader(m.room, m.floor, progressBadge());
  qBody.classList.add('ask');
  const stem = document.createElement('div'); stem.className = 'stem';
  const inner = document.createElement('div');
  const ctx = document.createElement('p'); ctx.className = 'ctx'; ctx.textContent = m.context;
  const q = document.createElement('p'); q.className = 'q'; q.textContent = m.question;
  inner.append(ctx, q); stem.appendChild(inner);
  const list = document.createElement('div'); list.className = 'opts';
  let picked = false;
  m.options.forEach((text, i) => {
    const b = document.createElement('button');
    b.innerHTML = '<span class="k">' + 'ABCDE'[i] + '</span><span></span>';
    b.lastChild.textContent = text;
    b.addEventListener('click', () => {
      if (picked) return;
      picked = true;
      b.classList.add('pick');                // light up the "final answer" for a moment, then send it
      if (navigator.vibrate) navigator.vibrate(15);
      // the question stays up, answer lit, until the game's 'saved' replaces it — no gap showing the
      // controls. Should that never come (connection lost), the panel still closes after a while.
      send({ t: 'answer', ev: m.ev, choice: i });
      flashTimer = setTimeout(() => { if (panel === 'ask') closeQuiz(); }, 5000);
    });
    list.appendChild(b);
  });
  qBody.append(stem, list);
  openQuiz('ask');
}
// after an event: one screen, straight from the question — how many events are left (or, after the
// last one, where Séneca is) — and Continuar takes the student back to the game
function showSaved(m) {
  releaseAll();
  const left = m.total - m.collected;
  if (left > 0) {
    setHeader(`Te ${left === 1 ? 'falta 1 evento' : `faltan ${left} eventos`}`, '', m.collected + '/' + m.total);
    qBody.append(note('Busca otro signo de admiración y oprime {act} debajo de él.'), panelButton('Continuar ▶', closeQuiz, true));
  } else {
    setHeader(`¡Completaste tus ${m.total} eventos!`, '', m.collected + '/' + m.total);
    qBody.append(note(m.next), panelButton('Continuar ▶', closeQuiz, true));
  }
  openQuiz('saved');
}
// The finale, at Séneca once every event is done: a congratulation, then the student's name and phone
// (only if they authorized personal data at sign-up), then "Descubrir puntaje" asks the game for the
// result, which arrives as a 'result' message and replaces this panel.
function showFinale() {
  releaseAll();
  setHeader('¡Felicitaciones!', `Piso ${TOP_FLOOR}`, progressBadge());
  const big = document.createElement('p'); big.className = 'hero'; big.textContent = '¡Lograste ser Uniandino por un día!';
  const logo = Object.assign(document.createElement('img'), { className: 'hero-logo', src: 'logo-uniandes.png', alt: 'Uniandes' });
  qBody.append(big, logo, panelButton('Continuar ▶', showStudentForm, true));
  openQuiz('finale');
}
function showStudentForm() {
  const reg = registered() ? JSON.parse(store.get('mlquest-reg')) : {};
  setHeader('Tus datos', '', progressBadge());
  const f = document.createElement('div'); f.className = 'reg form';
  const go = panelButton('Descubrir puntaje', () => {
    go.disabled = true; go.textContent = 'Calculando…';
    send({ t: 'finish', name: name ? name.value.trim() : '', phone: phone ? phone.value.trim() : '' });
  }, true);
  let name = null, phone = null;
  if (reg.personal) {
    const field = (label, attrs) => {
      const l = document.createElement('label'); l.textContent = label;
      const i = Object.assign(document.createElement('input'), attrs);
      i.addEventListener('input', check);
      l.appendChild(i); f.appendChild(l);
      return i;
    };
    name = field('Nombre', { type: 'text', placeholder: 'Tu nombre completo', autocomplete: 'name', maxLength: 80 });
    phone = field('Teléfono', { type: 'tel', placeholder: '300 123 4567', autocomplete: 'tel', inputMode: 'tel', maxLength: 30 });
  } else {
    f.appendChild(note('Como no autorizaste el uso de tus datos personales, no te pediremos nombre ni teléfono.'));
  }
  const hint = document.createElement('p'); hint.className = 'hint'; f.appendChild(hint);
  function check() {
    if (!name) return;
    const digits = phone.value.replace(/\D/g, '').length;
    const okName = name.value.trim().length >= 2, okPhone = digits >= 7 && digits <= 15;
    phone.classList.toggle('bad', !!phone.value.trim() && !okPhone);
    go.disabled = !okName || !okPhone;
    hint.textContent = phone.value.trim() && !okPhone ? 'Revisa tu teléfono.' : '';
  }
  const nav = document.createElement('div'); nav.className = 'nav'; nav.appendChild(go);
  qBody.append(f, nav);
  check();
  openQuiz('finale');
}
function showNotice(m) {
  releaseAll();
  setHeader(m.title, '', progressBadge());
  qBody.appendChild(note(m.text));
  // nothing the game shows closes by itself: the student goes back to playing with Continuar
  qBody.appendChild(panelButton('Continuar ▶', closeQuiz, true));
  openQuiz('notice');
}
function showResult(m) {
  releaseAll();
  setHeader('Tus 3 carreras más afines', '', m.collected + '/' + m.total);
  if (!m.top.length || !m.collected) {
    qBody.appendChild(note('Todavía no has respondido nada. Busca los signos de admiración del edificio.'));
  } else {
    const list = document.createElement('div'); list.className = 'rank';
    // each career with its icon; the first one, the most afín, stands out
    m.top.forEach((c, i) => {
      const row = document.createElement('div');
      if (i === 0) row.className = 'first';
      row.innerHTML = '<span class="pos">' + (i + 1) + '</span><span class="icon"></span><b></b> <span class="pct"></span>';
      const icon = careerIcon(c.key);
      if (icon) row.querySelector('.icon').style.backgroundImage = `url(${icon})`; else row.querySelector('.icon').remove();
      row.querySelector('b').textContent = c.name;
      row.querySelector('.pct').textContent = c.pct + '%';
      list.appendChild(row);
    });
    qBody.appendChild(list);
  }
  qBody.appendChild(panelButton('Continuar ▶', closeQuiz, true));
  openQuiz('result');
}
// the lift: a button per floor, 3 per row, each row reading low-to-high left-to-right, and the
// rows themselves stacked with the highest floors on top — like a real lift panel
function showLift(m) {
  releaseAll();
  setHeader('Ascensor', `Estás en el piso ${m.current}`, progressBadge());
  const grid = document.createElement('div'); grid.className = 'lift';
  const rows = [];
  for (let i = 0; i < m.floors.length; i += 3) rows.push(m.floors.slice(i, i + 3));
  const order = rows.reverse().flat();
  for (const n of order) {
    const b = document.createElement('button'); b.textContent = n;
    if (String(n).length > 1) b.classList.add('wide');
    if (n === m.current) { b.classList.add('here'); b.disabled = true; }
    b.addEventListener('click', () => { send({ t: 'floor', n }); closeQuiz(); });
    grid.appendChild(b);
  }
  qBody.append(grid, panelButton('Cerrar', () => { send({ t: 'liftClose' }); closeQuiz(); }));
  openQuiz('lift');
}

// ---- sign-up: the very first thing on a phone. The student's email, and whether they authorize the
// use of their personal and sensitive data. Without the personal-data authorization the email is not
// kept, and they still get to play.
const DATA_POLICY_URL = 'https://www.uniandes.edu.co/es/descargar/documento-documento-sobre-la-autorizacion-de-uso-de-datos-personales-y-propiedad-intelectual-otorgada-la-universidad-en-formularios-electronicos';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const registered = () => !!store.get('mlquest-reg');
function showRegister() {
  releaseAll();
  setHeader('Antes de empezar', 'Registro', '');
  const answers = { sensitive: null, personal: null };
  const f = document.createElement('div'); f.className = 'reg';
  const doc = document.createElement('p'); doc.className = 'doc';
  doc.append('Autorización para el uso de datos personales: ');
  doc.appendChild(Object.assign(document.createElement('a'), { href: DATA_POLICY_URL, target: '_blank', rel: 'noopener', textContent: 'Autorizacion-uso-de-datos-personales.pdf' }));
  const label = document.createElement('label'); label.textContent = 'Correo';
  const email = Object.assign(document.createElement('input'), { type: 'email', placeholder: 'tu@correo.com', autocomplete: 'email', inputMode: 'email' });
  email.setAttribute('autocapitalize', 'off'); email.spellcheck = false;
  label.appendChild(email);
  const yesNo = (text, key) => {
    const row = document.createElement('div'); row.className = 'yn';
    row.appendChild(Object.assign(document.createElement('span'), { textContent: text }));
    for (const [word, v] of [['Sí', true], ['No', false]]) {
      const b = document.createElement('button'); b.textContent = word;
      b.addEventListener('click', () => {
        answers[key] = v;
        row.querySelectorAll('button').forEach((x) => x.classList.toggle('pick', x === b));
        check();
      });
      row.appendChild(b);
    }
    return row;
  };
  const hint = document.createElement('p'); hint.className = 'hint';
  const go = panelButton('Continuar ▶', () => {
    const reg = { email: answers.personal ? email.value.trim() : null, sensitive: answers.sensitive, personal: answers.personal };
    store.set('mlquest-reg', JSON.stringify(reg));
    send({ t: 'register', ...reg });
    if (!store.get('mlquest-intro') || !char) showIntro(0); else closeQuiz();
  }, true);
  function check() {
    const ok = EMAIL_RE.test(email.value.trim());
    email.classList.toggle('bad', !!email.value.trim() && !ok);
    go.disabled = answers.sensitive === null || answers.personal === null || (answers.personal && !ok);
    hint.textContent = answers.personal === false ? 'Sin esta autorización no guardaremos tu correo, pero igual puedes jugar.'
      : email.value.trim() && !ok ? 'Revisa tu correo.' : '';
  }
  email.addEventListener('input', check);
  const nav = document.createElement('div'); nav.className = 'nav'; nav.appendChild(go);
  f.append(doc, label, yesNo('Acepto el tratamiento de datos sensibles', 'sensitive'), yesNo('Acepto el tratamiento de datos personales', 'personal'), hint);
  qBody.append(f, nav);
  check();
  openQuiz('register');
}

// ---- onboarding: what the map's symbols mean, the controls, and the goal ----
// The symbols are drawn with the game's own drawing code (symbols.js) and cut from the real map, so
// each one looks here exactly as it does on the big screen.
// the map as the big screen shows it, composed from its layers (back to front, as in game.js)
const mapImg = document.createElement('canvas'); mapImg.width = 1024; mapImg.height = 576;
const mapReady = Promise.all(['OtroFondo', 'Background', 'Suelos', 'Plataforma', 'Decoracion'].map((n) => new Promise((res) => {
  const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = `layers/${n}.png`;
}))).then((imgs) => { const g = mapImg.getContext('2d'); for (const i of imgs) if (i) g.drawImage(i, 0, 0); });
function symbolCanvas(w, h, scale, paint) {
  // drawn at the phone's real resolution: the signs come out smooth, the pixel art stays crisp
  const k = scale * (devicePixelRatio || 1);
  const c = document.createElement('canvas'); c.width = Math.ceil(w * k); c.height = Math.ceil(h * k);
  // sized in em (13px = 1em as drawn), so the symbols shrink with the panel when it has to fit
  c.style.width = w * scale / 13 + 'em'; c.style.height = h * scale / 13 + 'em';
  const g = c.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0); g.imageSmoothingEnabled = false;
  mapReady.then(() => paint(g));
  return c;
}
function legendItem(sym, title, text) {
  const d = document.createElement('div');
  const s = document.createElement('div'); s.className = 'sym'; s.appendChild(sym);
  const t = document.createElement('div');
  t.appendChild(Object.assign(document.createElement('b'), { textContent: title }));
  richText(t, text);
  d.append(s, t);
  return d;
}
function mapSymbols() {
  const firstLab = LABS[EVENTS[0].lab], door = LIFT.door, liftRow = FLOORS.find((f) => f.n === 1).row, dw = door.x1 - door.x0 + 1, dh = door.bottom - door.top + 1;
  const me = document.createElement('div');
  const mini = document.createElement('div'); mini.className = 'mini'; paintSprite(mini, char);
  const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = 'P' + slot; tag.style.color = tagColor();
  me.append(tag, mini);
  const senX = GOAL.x - 14, senY = GOAL.row - 48;   // Séneca and her star, cut from the map
  return [
    legendItem(symbolCanvas(16, 18, 3, (g) => drawBang(g, 8, 16)), 'Evento',
      'Párate debajo y oprime {act} para responder su pregunta.'),
    legendItem(symbolCanvas(labSignWidth(document.createElement('canvas').getContext('2d'), firstLab) + 2, 13, 1.5, (g) => drawLabSign(g, (labSignWidth(g, firstLab) + 2) / 2, 1, firstLab)), 'Laboratorio',
      'El letrero de color dice qué laboratorio es.'),
    legendItem(symbolCanvas(dw, dh + 13, 1.5, (g) => { drawFloorTag(g, LIFT.x - door.x0, 0, 2); g.drawImage(mapImg, door.x0, liftRow + door.top, dw, dh, 0, 13, dw, dh); }), 'Ascensor',
      `Frente a sus puertas oprime {act} y elige un piso de S1 a ${TOP_FLOOR}.`),
    legendItem(symbolCanvas(13, 12, 3, (g) => drawFloorTag(g, 6, 1, 3)), 'Número de piso',
      `Sobre cada ascensor. Los pisos van de S1 a ${TOP_FLOOR}.`),
    legendItem(symbolCanvas(66, 50, 1, (g) => { g.drawImage(mapImg, senX, senY, 66, 50, 0, 0, 66, 50); drawStar(g, GOAL.x - senX, GOAL.row - 20 - senY); }), `Séneca (piso ${TOP_FLOOR})`,
      `Con tus ${EVENTS_PER_PLAYER} eventos listos, oprime {act} junto a la estrella para ver tus resultados.`),
    legendItem(me, 'Tú', 'Tu personaje y tu etiqueta, del mismo color que en la pantalla.'),
  ];
}
function controlKeys() {
  const key = (html, bg, text) => {
    const d = document.createElement('div');
    const k = document.createElement('span'); k.className = 'k2'; if (bg) k.style.background = bg; k.innerHTML = html;
    d.appendChild(k); richText(d, text);
    return d;
  };
  const act = key('', '#ffd23f', 'Interactuar: eventos, ascensor y Séneca');
  act.firstChild.appendChild(Object.assign(document.createElement('img'), { src: HAND_URL, alt: '' }));
  const lr = key('<span>◀</span><span>▶</span>', '', 'Moverte a los lados');
  lr.firstChild.classList.add('lrk');
  return [lr, key('SALTO', '#3a5fcd', 'Saltar escalones y muebles'), key('DASH', '#2f8f5b', 'Impulso rápido'), act];
}
// a change to the look: keep it on the phone, tell the game, and redraw the choice page
function pickLook(change) {
  if (change.char) char = change.char;
  if (change.skin !== undefined) skin = change.skin;
  if (change.hair !== undefined) hair = change.hair;
  store.set('mlquest-char', char || ''); store.set('mlquest-skin', skin); store.set('mlquest-hair', hair);
  if (char) send({ t: 'look', c: char, skin, hair });
  showCharacter();
  showIntro(0);
}
function lookPicker() {
  const g = document.createElement('div'); g.className = 'looks';
  const cards = document.createElement('div'); cards.className = 'chars';
  for (const [c, label] of [['m', 'Nova'], ['f', 'Aura']]) {
    const b = document.createElement('button'); if (c === char) b.classList.add('pick');
    const pic = document.createElement('div'); pic.className = 'pic'; paintSprite(pic, c);
    b.append(pic, label);
    b.addEventListener('click', () => pickLook({ char: c }));
    cards.appendChild(b);
  }
  const rows = document.createElement('div'); rows.className = 'swatches';
  // each swatch shows the shade that covers most of the sprite: the skin's light one, the hair's mid one
  for (const [title, list, current, field, shade] of [['Piel', SKINS, skin, 'skin', 0], ['Cabello', HAIRS, hair, 'hair', 1]]) {
    const row = document.createElement('div');
    row.appendChild(Object.assign(document.createElement('b'), { textContent: title }));
    list.forEach((opt, i) => {
      const b = document.createElement('button'); b.setAttribute('aria-label', `${title} ${opt.name}`); b.title = opt.name;
      b.style.background = rgbCss(opt.shades[shade]);
      if (i === current) b.classList.add('pick');
      b.addEventListener('click', () => pickLook({ [field]: i }));
      row.appendChild(b);
    });
    rows.appendChild(row);
  }
  g.append(cards, rows);
  return g;
}
const INTRO = [
  { title: 'Elige tu personaje', body: lookPicker },
  { title: 'Símbolos del mapa', body: () => { const g = document.createElement('div'); g.className = 'legend'; g.append(...mapSymbols()); return g; } },
  { title: 'Controles', body: () => { const g = document.createElement('div'); g.className = 'keys'; g.append(...controlKeys()); return g; } },
  { title: 'Tu misión', body: () => {
    const ol = document.createElement('ol'); ol.className = 'steps';
    for (const s of [
      'Recorre el edificio y busca los signos de admiración: cada uno es un evento de un laboratorio.',
      `Párate debajo y oprime {act}. Responde ${EVENTS_PER_PLAYER} eventos distintos, sin límite de tiempo.`,
      `Para cambiar de piso usa las escaleras o el ascensor (pisos S1 a ${TOP_FLOOR}).`,
      `Cuando termines, ve con Séneca en el ${TOP_FLOOR}.º piso y oprime {act} para ver tus 3 carreras más afines.`,
    ]) ol.appendChild(richText(document.createElement('li'), s));
    return ol;
  } },
];
function showIntro(i) {
  releaseAll();
  setHeader(INTRO[i].title, 'Cómo jugar', `${i + 1}/${INTRO.length}`);
  const nav = document.createElement('div'); nav.className = 'nav';
  if (i > 0) nav.appendChild(panelButton('◀ Anterior', () => showIntro(i - 1)));
  if (i < INTRO.length - 1) {
    const next = panelButton('Siguiente ▶', () => showIntro(i + 1), true);
    next.disabled = i === 0 && !char;   // a character has to be picked before going on
    nav.appendChild(next);
  }
  else nav.appendChild(panelButton('¡A jugar!', () => { store.set('mlquest-intro', '1'); closeQuiz(); }, true));
  qBody.append(INTRO[i].body(), nav);
  openQuiz('intro');
}
document.getElementById('help').addEventListener('click', () => showIntro(0));

// Each button tracks its own pointer, so several can be held at once (multi-touch).
for (const btn of document.querySelectorAll('button[data-b]')) {
  const name = btn.dataset.b;
  const set = (v) => {
    if (!!state[name] === v) return;
    state[name] = v; btn.classList.toggle('on', v); send();
    if (v && navigator.vibrate) navigator.vibrate(8);
  };
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); set(true); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(ev, () => set(false));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
}
// nothing on the phone scrolls or pans: the panels are sized to fit the screen instead
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
addEventListener('blur', () => { for (const k in state) state[k] = false; document.querySelectorAll('.on').forEach((b) => b.classList.remove('on')); send(); });
if (!registered()) showRegister();
connect();
</script>
</body>
</html>
